name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: apps/zcode-cli/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run lint
      - name: Typecheck
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run typecheck
      - name: Build
        run: pnpm --filter zcode-cli build
      - name: Smoke
        run: |
          node apps/zcode-cli/packages/cli/dist/zcode.cjs --version
          node apps/zcode-cli/packages/cli/dist/zcode.cjs --help
      - name: Test (known-failures gate)
        run: pnpm test:ci
