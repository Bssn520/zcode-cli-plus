name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter zcode-cli build

      - name: Smoke
        run: |
          node apps/zcode-cli/packages/cli/dist/zcode.cjs --version
          node apps/zcode-cli/packages/cli/dist/zcode.cjs --help

      - name: Typecheck
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run typecheck

      - name: Test (known-failures gate)
        run: pnpm test:ci
