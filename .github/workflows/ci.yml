name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          # PRs need full history for turbo --affected; pushes can be shallow.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: apps/zcode-cli/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Lint (root oxlint, same as upstream `pnpm lint`)
        run: pnpm lint
      - name: Typecheck
        working-directory: apps/zcode-cli
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ../../node_modules/.bin/turbo run typecheck --affected --force
          else
            ../../node_modules/.bin/turbo run typecheck --force
          fi
      - name: Build
        # Smoke needs the CLI binary; always build zcode-cli (affected applies to typecheck/test).
        # Several plugin packages (browser-use-plugin writes scripts/browser-client.mjs + dist-types/,
        # plugin assets used by @zcode/bootstrap bundled-plugins tests and @zcode/cli build-sea) emit
        # build outputs outside the declared turbo outputs (dist/**), so a turbo cache hit restored
        # from actions/cache skips the build and leaves those assets missing; force until outputs
        # are declared upstream.
        env:
          TURBO_FORCE: "true"
        run: pnpm --filter zcode-cli build
      - name: Prepare npm package
        run: node tools/prepare-npm-package.mjs .npm-package
      - name: Verify packed npm package (global install + TUI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          bash tools/verify-npm-package.sh .npm-package
      - name: Smoke
        run: |
          node apps/zcode-cli/packages/cli/dist/zcode.cjs --version
          node apps/zcode-cli/packages/cli/dist/zcode.cjs --help
      - name: Test (known-failures gate)
        env:
          ZCP_AFFECTED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: pnpm test:ci
