name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs['npm--release_created'] }}
      tag_name: ${{ steps.rp.outputs['npm--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter zcode-cli build
      - name: Prepare npm package (@bssn520/zcode-cli-plus)
        run: node tools/prepare-npm-package.mjs .npm-package
      - name: Publish via Trusted Publishing (no NPM_TOKEN)
        working-directory: .npm-package
        run: npm publish --provenance --access public
      - name: Attach tarball to GitHub Release
        working-directory: .npm-package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release upload "${{ needs.release-please.outputs.tag_name }}" ./*.tgz --clobber
